services:
  - type: web
    name: hydrocast-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_PROJECT_ID
        value: hydra-1963e
      - key: FIRESTORE_WEATHER_COLLECTION
        value: weather_snapshots
      - key: WEATHER_REFRESH_MINUTES
        value: "15"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
